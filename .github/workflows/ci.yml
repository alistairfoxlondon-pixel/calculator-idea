name: CI
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: dom, curl, mbstring, bcmath
      - run: composer install --no-interaction --prefer-dist
      - run: ./vendor/bin/pint --test
      - run: ./vendor/bin/phpstan analyse --level=max --no-progress
      - run: php artisan test
      - run: grep -R -i "openai|anthropic|gemini|deepseek|groq|mistral|cohere|perplexity|openrouter|huggingface" app/ resources/ || echo "no banned providers"
      - run: npm ci && npm run build
